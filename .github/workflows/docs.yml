name: Docs

on:
  push:
    paths:
      - 'docs/**'
      - 'upstream/**'
      - 'Readme.md'
      - 'CONTRIBUTING.md'
      - 'src/**'
      - 'scripts/check-docs.py'
      - 'scripts/smoke-docs.py'
      - 'Cargo.toml'
      - 'badger.star'
      - '.github/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'upstream/**'
      - 'Readme.md'
      - 'CONTRIBUTING.md'
      - 'src/**'
      - 'scripts/check-docs.py'
      - 'scripts/smoke-docs.py'
      - 'Cargo.toml'
      - 'badger.star'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check documentation sources
        run: python3 scripts/check-docs.py
      - name: Install mdBook
        env:
          MDBOOK_VERSION: '0.5.4'
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl --fail --location --retry 3 "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/mdbook.tar.gz"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build book
        run: mdbook build docs
      - name: Check rendered links
        run: python3 scripts/check-docs.py --html docs/book
      - name: Save book for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-bundle-guide
          path: docs/book
          if-no-files-found: error
      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy book
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
