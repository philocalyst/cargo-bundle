name: CI

on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: read

jobs:
  sibling-sources:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.sources.outputs.configured }}
    steps:
      - id: sources
        name: Check sibling source configuration
        env:
          APPIMAGE_RS_URL: ${{ vars.APPIMAGE_RS_URL }}
          APPIMAGE_RS_REF: ${{ vars.APPIMAGE_RS_REF }}
        run: |
          if python3 - <<'PY'
          import os, re, sys
          names = ('APPIMAGE_RS',)
          valid = all(
              os.environ.get(f'{name}_URL', '').strip()
              and re.fullmatch(r'[0-9a-fA-F]{40}', os.environ.get(f'{name}_REF', '').strip())
              for name in names
          )
          sys.exit(0 if valid else 1)
          PY
          then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Rust build, test, Clippy, and formatting jobs are skipped until the unpublished appimage-rs source has a clone URL and full 40-character commit SHA. See docs/src/contributing.md.'
          fi

  test:
    needs: sibling-sources
    if: needs.sibling-sources.outputs.configured == 'true'
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    name: Test
    steps:
      - uses: actions/checkout@v4
        with:
          path: cargo-bundle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: ./cargo-bundle/.github/actions/sibling-sources
        with:
          appimage-url: ${{ vars.APPIMAGE_RS_URL }}
          appimage-ref: ${{ vars.APPIMAGE_RS_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-features --verbose --all-targets
        working-directory: cargo-bundle
      - name: Run tests
        run: cargo test --all-features --verbose --all-targets
        working-directory: cargo-bundle
      - name: Build the guide's first-bundle example
        run: python scripts/smoke-docs.py
        working-directory: cargo-bundle
      - name: Test embedded AppImage execution
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo test --manifest-path ../appimage-rs/Cargo.toml --locked --test runtime
        working-directory: cargo-bundle
      - name: Check embedded launcher provenance
        run: python ../appimage-rs/runtime/build-embedded.py --check
        working-directory: cargo-bundle

  clippy:
    needs: sibling-sources
    if: needs.sibling-sources.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cargo-bundle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: ./cargo-bundle/.github/actions/sibling-sources
        with:
          appimage-url: ${{ vars.APPIMAGE_RS_URL }}
          appimage-ref: ${{ vars.APPIMAGE_RS_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: cargo-bundle

  rustfmt:
    needs: sibling-sources
    if: needs.sibling-sources.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cargo-bundle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: ./cargo-bundle/.github/actions/sibling-sources
        with:
          appimage-url: ${{ vars.APPIMAGE_RS_URL }}
          appimage-ref: ${{ vars.APPIMAGE_RS_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add rustfmt
      - run: cargo fmt --package cargo-bundle -- --check
        working-directory: cargo-bundle
