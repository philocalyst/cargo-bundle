name: CI

on: [ push, pull_request, workflow_dispatch ]

env:
  # The vendored osslsigncode (windows-signing) relies on POSIX functions that
  # gcc 14 no longer declares implicitly. Other platforms do not need this, and
  # it breaks the vendored OpenSSL build on macOS.
  CFLAGS: ${{ runner.os == 'Linux' && '-D_GNU_SOURCE' || '' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    name: Test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-features --verbose --all-targets
      - name: Run tests
        run: cargo test --all-features --verbose --all-targets
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check
