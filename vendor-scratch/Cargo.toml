[package]
name = "appimage-rs"
version = "0.3.1"
edition = "2024"
rust-version = "1.86"
description = "Pure-Rust reader, extractor, packer, launcher and FUSE mounter for type-2 AppImages"
license = "MIT"
readme = "README.md"
homepage = "https://tangled.org/philocalyst.bsky.social/Appstream-rs/"
repository = "https://tangled.org/philocalyst.bsky.social/Appstream-rs/"

[lib]
name = "appimage"

[[bin]]
name = "appimage-runtime"
required-features = ["launcher"]

[[test]]
name = "launcher"
required-features = ["launcher"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
# The AppImage launcher: `appimage::launcher` and the `appimage-runtime` binary.
launcher = ["dep:signal-hook"]
# Opt-in SquashFS decompressors, both pure Rust.
xz = ["dep:lzma-rs"]
zstd = ["dep:ruzstd"]

[dependencies]
backhand = { version = "0.25", default-features = false, features = ["gzip", "lzo", "lz4"] }
# Every write into a tree goes through an open directory handle, so a symbolic
# link in the destination cannot send it elsewhere.
cap-std = "4.0.3"
cap-tempfile = "4.0.3"
glob = "0.3"
libc = "0.2"
lzma-rs = { version = "0.3", optional = true }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
ruzstd = { version = "0.9", optional = true }
same-file = "1"
signal-hook = { version = "0.3", optional = true }
tempfile = "3"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Without its `libfuse` features, `fuser` is pure Rust: it mounts with the
# `mount(2)` system call and talks to /dev/fuse itself.
fuser = { version = "0.18", default-features = false }

[dev-dependencies]
backhand = { version = "0.25", default-features = false, features = ["gzip"] }

# A small, static launcher:
#   cargo build --profile runtime --features launcher --bin appimage-runtime \
#       --target x86_64-unknown-linux-musl
[profile.runtime]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
